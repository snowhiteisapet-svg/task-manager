
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <link rel="javascript" href="script.js">
 </head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fas fa-tasks"></i> Task Manager</h1>
      <div class="header-controls">
        <button id="themeToggle" class="theme-toggle">
          <i class="fas fa-moon"></i> Night Mode
        </button>
        <p id="dateDisplay"></p>
      </div>
    </div>
    
    <div class="input-section">
      <div class="input-group">
        <input id="taskInput" type="text" placeholder="Add a new task..." />
        <select id="categorySelect">
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
          <option value="Health">Health</option>
          <option value="Learning">Learning</option>
          <option value="Shopping">Shopping</option>
        </select>
        <select id="prioritySelect">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <button id="addBtn" class="btn-primary">
          <i class="fas fa-plus"></i> Add Task
        </button>
      </div>
    </div>
    
    <div class="search-filter-section">
      <input id="searchInput" type="text" placeholder="Search tasks..." />
      <select id="sortSelect">
        <option value="date">Sort by Date</option>
        <option value="priority">Sort by Priority</option>
        <option value="category">Sort by Category</option>
        <option value="status">Sort by Status</option>
      </select>
    </div>
    
    <div class="main">
      <div class="tasks-section">
        <div class="section-header">
          <h2><i class="fas fa-clipboard-list"></i> Your Tasks</h2>
          <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="high">High</button>
            <button class="filter-btn" data-filter="medium">Medium</button>
            <button class="filter-btn" data-filter="low">Low</button>
          </div>
        </div>
        
        <ul id="taskList" class="task-list"></ul>
        
        <div id="emptyState" class="empty-state">
          <i class="fas fa-clipboard-list"></i>
          <p>No tasks yet. Add your first task to get started.</p>
        </div>
      </div>
      
      <div class="sidebar">
        <div class="stats-card">
          <h3><i class="fas fa-chart-pie"></i> Summary</h3>
          <div class="stats">
            <div class="stat-item">
              <i class="fas fa-list"></i>
              <div>
                <span class="stat-value" id="totalTasks">0</span>
                <span class="stat-label">Total</span>
              </div>
            </div>
            <div class="stat-item">
              <i class="fas fa-check-circle"></i>
              <div>
                <span class="stat-value" id="completedTasks">0</span>
                <span class="stat-label">Completed</span>
              </div>
            </div>
            <div class="stat-item">
              <i class="fas fa-clock"></i>
              <div>
                <span class="stat-value" id="pendingTasks">0</span>
                <span class="stat-label">Pending</span>
              </div>
            </div>
          </div>
        </div>
        
        <div class="productivity-tracker">
          <h3><i class="fas fa-chart-line"></i> Progress</h3>
          <div class="progress-section">
            <div class="progress-label">
              <span>Completion Rate</span>
              <span id="progressText">0%</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
          </div>
        </div>
        
        <div class="quick-actions">
          <h3><i class="fas fa-bolt"></i> Quick Actions</h3>
          <button id="clearCompleted" class="btn-secondary">
            <i class="fas fa-check-double"></i> Clear Completed
          </button>
          <button id="exportBtn" class="btn-export">
            <i class="fas fa-download"></i> Export Tasks
          </button>
          <button id="clearAll" class="btn-danger">
            <i class="fas fa-trash"></i> Clear All
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <div id="notification" class="notification">
    <span id="notificationText"></span>
  </div>
  
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit Task</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <label>Task</label>
        <input type="text" id="editTaskInput" placeholder="Task description" />
        
        <label>Category</label>
        <select id="editCategorySelect">
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
          <option value="Health">Health</option>
          <option value="Learning">Learning</option>
          <option value="Shopping">Shopping</option>
        </select>
        
        <label>Priority</label>
        <select id="editPrioritySelect">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
        
        <label>Notes</label>
        <textarea id="editNotesInput" placeholder="Add notes (optional)"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="modalCancelBtn">Cancel</button>
        <button class="btn-save" id="modalSaveBtn">Save Changes</button>
      </div>
    </div>
  </div>
  
  <audio id="dingSound" src="https://assets.mixkit.co/active_storage/sfx/286/286-preview.mp3" preload="auto"></audio>
  <audio id="addSound" src="https://assets.mixkit.co/active_storage/sfx/257/257-preview.mp3" preload="auto"></audio>
